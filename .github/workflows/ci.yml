name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authz
          POSTGRES_PASSWORD: authz_password
          POSTGRES_DB: authz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          AUTHZ_TEST_PG_URL: postgres://authz:authz_password@localhost:5432/authz_test
          AUTHZ_REQUIRE_PG_TESTS: "1"

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build data-plane image
        run: docker build -t uae-data-plane .

      - name: Smoke test image (boot, auth gate, fail-closed empty store)
        run: |
          docker run -d --name data-plane -p 3000:3000 -e UAE_API_KEYS=ci-smoke-key uae-data-plane
          healthy=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/healthz >/dev/null; then healthy=1; break; fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "::error::data plane never became healthy"
            docker logs data-plane
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/check \
            -H 'content-type: application/json' -d '{}')
          if [ "$code" != "401" ]; then
            echo "::error::expected 401 without API key, got $code"
            docker logs data-plane
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/check \
            -H 'content-type: application/json' -H 'x-api-key: ci-smoke-key' \
            -d '{"subject":"user:a","action":"x.read","resource":"doc:1"}')
          if [ "$code" != "503" ]; then
            echo "::error::expected 503 fail-closed on empty store, got $code"
            docker logs data-plane
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/version \
            -H 'x-api-key: ci-smoke-key')
          if [ "$code" != "503" ]; then
            echo "::error::expected 503 from /version with no active policy, got $code"
            docker logs data-plane
            exit 1
          fi
          docker rm -f data-plane

  publish:
    # Ship the smoke-tested image to GHCR on main only; PRs build without pushing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push data-plane image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/data-plane"
          docker build -t "$image:${{ github.sha }}" -t "$image:main" .
          docker push "$image:${{ github.sha }}"
          docker push "$image:main"
